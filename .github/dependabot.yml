version: 2

updates:
  # GitHub Actions — keep workflow dependencies up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "ci"
    reviewers:
      - "CodeOpsMS"
    open-pull-requests-limit: 10

  # Docker — propose chart image updates for manual tag/digest review
  - package-ecosystem: "docker"
    directory: "/charts/typemill"
    # The application is updated by auto-update.yml with tag, digest and chart version.
    # The v2.26 migration source must remain paired with its reviewed file hashes.
    ignore:
      - dependency-name: "kixote/typemill"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"
      - "docker"
    reviewers:
      - "CodeOpsMS"
    open-pull-requests-limit: 5
