name: Auto-Update Typemill Image

on:
  schedule:
    # Check Docker Hub every 6 hours for new tags
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

jobs:
  check-update:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check for new Typemill image tag
        id: check
        run: |
          # Get current appVersion from Chart.yaml
          CURRENT_VERSION=$(grep '^appVersion:' charts/typemill/Chart.yaml | awk '{print $2}' | tr -d '"')
          echo "Current appVersion: $CURRENT_VERSION"

          CURRENT_DIGEST=$(awk '
            /^image:/ { in_image=1; next }
            in_image && /^  digest:/ { gsub(/"/, "", $2); print $2; exit }
            in_image && /^[^ ]/ { exit }
          ' charts/typemill/values.yaml)
          echo "Current image digest: $CURRENT_DIGEST"
          if ! [[ "$CURRENT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "The current default image digest is missing or invalid: ${CURRENT_DIGEST}"
            exit 1
          fi

          # Query Docker Hub for all tags, filter for stable vX.Y.Z releases
          LATEST_TAG=$(curl -s "https://hub.docker.com/v2/repositories/kixote/typemill/tags/?page_size=100&ordering=last_updated" \
            | jq -r '.results[].name' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -1)
          echo "Latest Docker Hub tag: $LATEST_TAG"

          if [ -z "$LATEST_TAG" ]; then
            echo "No stable tags found on Docker Hub"
            echo "update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TAG_METADATA=$(curl --fail --silent --show-error --location --retry 3 \
            "https://hub.docker.com/v2/repositories/kixote/typemill/tags/${LATEST_TAG}")
          LATEST_DIGEST=$(jq -r '.digest // empty' <<< "$TAG_METADATA")
          if ! [[ "$LATEST_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Docker Hub returned an invalid digest for ${LATEST_TAG}: ${LATEST_DIGEST}"
            exit 1
          fi
          echo "Latest Docker Hub digest: $LATEST_DIGEST"

          if [ "$CURRENT_VERSION" = "$LATEST_TAG" ] && [ "$CURRENT_DIGEST" = "$LATEST_DIGEST" ]; then
            echo "Already up to date"
            echo "update=false" >> "$GITHUB_OUTPUT"
          else
            echo "Update available: $CURRENT_VERSION@$CURRENT_DIGEST → $LATEST_TAG@$LATEST_DIGEST"
            {
              echo "update=true"
              echo "new_tag=$LATEST_TAG"
              echo "old_tag=$CURRENT_VERSION"
              echo "new_digest=$LATEST_DIGEST"
              echo "old_digest=$CURRENT_DIGEST"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Preserve an existing update branch
        id: existing-update
        if: steps.check.outputs.update == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_BRANCH: chore/update-typemill-${{ steps.check.outputs.new_tag }}
          LATEST_TAG: ${{ steps.check.outputs.new_tag }}
          LATEST_DIGEST: ${{ steps.check.outputs.new_digest }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          SKIP_UPDATE=false
          OPEN_PULL_REQUESTS=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --limit 100 \
            --json url,headRefName,baseRefName,isCrossRepository)
          EXISTING_UPDATES=$(jq \
            --arg base "$DEFAULT_BRANCH" \
            '[.[] | select(
              .isCrossRepository == false and
              .baseRefName == $base and
              (.headRefName | startswith("chore/update-typemill-v"))
            )]' <<< "$OPEN_PULL_REQUESTS")
          EXISTING_UPDATE_COUNT=$(jq 'length' <<< "$EXISTING_UPDATES")

          if [[ "$EXISTING_UPDATE_COUNT" -gt 1 ]]; then
            echo "ERROR: Multiple open Typemill update pull requests require manual consolidation:" >&2
            jq -r '.[] | "  \(.headRefName): \(.url)"' <<< "$EXISTING_UPDATES" >&2
            exit 1
          fi

          EXISTING_PR_URL=$(jq -r '.[0].url // ""' <<< "$EXISTING_UPDATES")
          EXISTING_PR_BRANCH=$(jq -r '.[0].headRefName // ""' <<< "$EXISTING_UPDATES")

          if [[ -n "$EXISTING_PR_URL" ]]; then
            EXISTING_CHART_CONTENT=$(gh api \
              "repos/${GITHUB_REPOSITORY}/contents/charts/typemill/Chart.yaml?ref=${EXISTING_PR_BRANCH}" \
              --jq '.content' | base64 --decode)
            EXISTING_VALUES_CONTENT=$(gh api \
              "repos/${GITHUB_REPOSITORY}/contents/charts/typemill/values.yaml?ref=${EXISTING_PR_BRANCH}" \
              --jq '.content' | base64 --decode)
            EXISTING_TAG=$(awk '$1 == "appVersion:" {gsub(/"/, "", $2); print $2; exit}' <<< "$EXISTING_CHART_CONTENT")
            EXISTING_DIGEST=$(awk '
              /^image:/ { in_image=1; next }
              in_image && /^  digest:/ { gsub(/"/, "", $2); print $2; exit }
              in_image && /^[^ ]/ { exit }
            ' <<< "$EXISTING_VALUES_CONTENT")

            if [[ "$EXISTING_TAG" != "$LATEST_TAG" || "$EXISTING_DIGEST" != "$LATEST_DIGEST" ]]; then
              echo "ERROR: Existing update PR is stale for mutable tag ${LATEST_TAG}." >&2
              echo "PR: ${EXISTING_PR_BRANCH} (${EXISTING_PR_URL})" >&2
              echo "PR pin: ${EXISTING_TAG}@${EXISTING_DIGEST}" >&2
              echo "Registry: ${LATEST_TAG}@${LATEST_DIGEST}" >&2
              echo "Review and update or close the existing PR; it will not be overwritten automatically." >&2
              exit 1
            fi

            SKIP_UPDATE=true
            echo "Preserving current update pull request: ${EXISTING_PR_BRANCH} (${EXISTING_PR_URL})"
          else
            if git ls-remote --exit-code --heads origin "refs/heads/$UPDATE_BRANCH" >/dev/null 2>&1; then
              echo "ERROR: Remote update branch exists without an open pull request: $UPDATE_BRANCH" >&2
              echo "Delete the orphaned branch or restore its pull request before retrying." >&2
              exit 1
            else
              REMOTE_STATUS=$?
              if [[ "$REMOTE_STATUS" -ne 2 ]]; then
                echo "ERROR: Could not verify whether update branch $UPDATE_BRANCH exists." >&2
                exit "$REMOTE_STATUS"
              fi
            fi
          fi

          echo "skip=$SKIP_UPDATE" >> "$GITHUB_OUTPUT"

      - name: Bump chart version and update appVersion
        if: >-
          steps.check.outputs.update == 'true' &&
          steps.existing-update.outputs.skip != 'true'
        run: |
          NEW_TAG="${{ steps.check.outputs.new_tag }}"
          OLD_TAG="${{ steps.check.outputs.old_tag }}"
          NEW_DIGEST="${{ steps.check.outputs.new_digest }}"
          OLD_DIGEST="${{ steps.check.outputs.old_digest }}"

          # Bump chart patch version
          CURRENT_CHART_VERSION=$(grep '^version:' charts/typemill/Chart.yaml | awk '{print $2}')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_CHART_VERSION"
          NEW_CHART_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          echo "Chart version: $CURRENT_CHART_VERSION → $NEW_CHART_VERSION"

          # Update Chart.yaml
          sed -i "s/^version: .*/version: ${NEW_CHART_VERSION}/" charts/typemill/Chart.yaml
          sed -i "s/^appVersion: .*/appVersion: \"${NEW_TAG}\"/" charts/typemill/Chart.yaml

          # Keep the default deployment immutable and in sync with appVersion.
          sed -i "0,/^  digest: .*/s//  digest: \"${NEW_DIGEST}\"/" charts/typemill/values.yaml

          # Update only the current application image annotation. The dedicated
          # v2.26.0 security-migration source must remain independently pinned.
          awk -v tag="$NEW_TAG" '
            $0 == "    - name: typemill" { in_current_image=1 }
            in_current_image && /^      image: kixote\/typemill:/ {
              print "      image: kixote/typemill:" tag
              in_current_image=0
              next
            }
            { print }
          ' charts/typemill/Chart.yaml > charts/typemill/Chart.yaml.tmp
          mv charts/typemill/Chart.yaml.tmp charts/typemill/Chart.yaml

          # Keep only generic current-image documentation in sync. Historical
          # release and security-migration sections require manual review.
          sed -i -E \
            "s/(image for Typemill )v[0-9]+\.[0-9]+\.[0-9]+( currently supports)/\1${NEW_TAG}\2/" \
            README.md
          sed -i -E \
            "s/(upstream Typemill )v[0-9]+\.[0-9]+\.[0-9]+( image)/\1${NEW_TAG}\2/" \
            charts/typemill/README.md
          sed -i -E \
            "s/(default Typemill image is pinned to the verified )v[0-9]+\.[0-9]+\.[0-9]+/\1${NEW_TAG}/" \
            charts/typemill/README.md
          sed -i -E \
            "s/^(  tag: )v[0-9]+\.[0-9]+\.[0-9]+/\1${NEW_TAG}/" \
            charts/typemill/README.md
          sed -i -E \
            "s/(--set image\.tag=)v[0-9]+\.[0-9]+\.[0-9]+/\1${NEW_TAG}/" \
            charts/typemill/README.md
          sed -i -E \
            "s/(replace it with the )v[0-9]+\.[0-9]+\.[0-9]+( digest)/\1${NEW_TAG}\2/" \
            charts/typemill/README.md
          sed -i -E \
            "s/^(  --version )[0-9]+\.[0-9]+\.[0-9]+/\1${NEW_CHART_VERSION}/" \
            charts/typemill/README.md
          sed -i "s/${OLD_DIGEST}/${NEW_DIGEST}/g" charts/typemill/tests/deployment_test.yaml
          sed -i "s/${OLD_TAG}/${NEW_TAG}/g" charts/typemill/tests/deployment_test.yaml

          # Security metadata belongs to a specific upstream release. Automated
          # image bumps start neutral and can be marked explicitly during review.
          sed -i 's/artifacthub.io\/containsSecurityUpdates: "true"/artifacthub.io\/containsSecurityUpdates: "false"/' charts/typemill/Chart.yaml

          # Replace release-specific Artifact Hub changes so stale hardening notes
          # are not repeated in every automated image update.
          awk -v tag="$NEW_TAG" '
            /^  artifacthub.io\/changes: \|/ {
              print
              print "    - kind: changed"
              print "      description: Update Typemill to " tag
              skipping=1
              next
            }
            skipping && /^  artifacthub.io\/images: \|/ { skipping=0 }
            !skipping { print }
          ' charts/typemill/Chart.yaml > charts/typemill/Chart.yaml.tmp
          mv charts/typemill/Chart.yaml.tmp charts/typemill/Chart.yaml

          {
            echo "NEW_CHART_VERSION=$NEW_CHART_VERSION"
            echo "NEW_TAG=$NEW_TAG"
            echo "OLD_TAG=$OLD_TAG"
            echo "NEW_DIGEST=$NEW_DIGEST"
            echo "OLD_DIGEST=$OLD_DIGEST"
          } >> "$GITHUB_ENV"

      - name: Create update pull request
        id: create-pull-request
        if: >-
          steps.check.outputs.update == 'true' &&
          steps.existing-update.outputs.skip != 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/update-typemill-${{ env.NEW_TAG }}
          delete-branch: true
          commit-message: "chore: update Typemill ${{ env.OLD_TAG }} → ${{ env.NEW_TAG }} (chart ${{ env.NEW_CHART_VERSION }})"
          title: "chore: update Typemill ${{ env.OLD_TAG }} → ${{ env.NEW_TAG }}"
          body: |
            Automated Typemill image update detected from Docker Hub.

            - Typemill image: `${{ env.OLD_TAG }}` → `${{ env.NEW_TAG }}`
            - Image digest: `${{ env.OLD_DIGEST }}` → `${{ env.NEW_DIGEST }}`
            - Chart version: `${{ env.NEW_CHART_VERSION }}`

            Upstream release notes and security metadata require manual review.
            Publishing is intentionally handled only by `release.yml` after this PR is merged.
          reviewers: CodeOpsMS

      - name: Verify update pull request was created
        if: >-
          steps.check.outputs.update == 'true' &&
          steps.existing-update.outputs.skip != 'true'
        env:
          PR_NUMBER: ${{ steps.create-pull-request.outputs.pull-request-number }}
          PR_URL: ${{ steps.create-pull-request.outputs.pull-request-url }}
        run: |
          if [ -z "$PR_NUMBER" ] || [ -z "$PR_URL" ]; then
            echo "The update branch was created, but no pull request was returned."
            echo "Verify that GitHub Actions may create pull requests in the repository settings."
            exit 1
          fi
          echo "Created pull request #${PR_NUMBER}: ${PR_URL}"

      # Pull requests created with GITHUB_TOKEN do not emit another pull_request
      # event. Dispatch validation explicitly when the branch content changed,
      # but do not repeat the same run on every scheduled check.
      - name: Dispatch chart validation
        if: >-
          steps.create-pull-request.outputs.pull-request-operation == 'created' ||
          steps.create-pull-request.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_BRANCH: chore/update-typemill-${{ env.NEW_TAG }}
        run: gh workflow run lint-test.yml --ref "$UPDATE_BRANCH"
