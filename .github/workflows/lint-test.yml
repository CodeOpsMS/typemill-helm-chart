name: Lint and Test Charts

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - 'charts/**'

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        helm-version:
          - v3.21.3
          - v4.2.3
    name: Helm ${{ matrix.helm-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ matrix.helm-version }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.8.0

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --target-branch ${{ github.event.repository.default_branch }})
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run chart-testing (lint)
        if: steps.list-changed.outputs.changed == 'true'
        run: ct lint --target-branch ${{ github.event.repository.default_branch }}

      - name: Install helm-unittest plugin
        if: steps.list-changed.outputs.changed == 'true'
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --verify=false

      - name: Run helm unittest
        if: steps.list-changed.outputs.changed == 'true'
        run: helm unittest charts/typemill

      - name: Run direct Helm lint and representative render
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          helm lint charts/typemill --strict
          helm template ci-render charts/typemill \
            --namespace typemill-ci \
            --set ai.enabled=true \
            --set ai.adapter=openai \
            --set ai.baseUrl=http://ollama.default.svc.cluster.local:11434/v1 \
            --set ai.model=smoke-test \
            --set ingress.enabled=false \
            >/tmp/typemill-rendered.yaml

      - name: Verify unsafe and invalid values are rejected
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          expect_failure() {
            if "$@" >/tmp/expected-failure.log 2>&1; then
              echo "Expected command to fail: $*"
              exit 1
            fi
          }

          expect_failure helm template invalid charts/typemill --set replicaCount=2
          expect_failure helm template invalid charts/typemill --set autoscaling.enabled=true
          expect_failure helm template invalid charts/typemill --set image.digest=invalid
          expect_failure helm template invalid charts/typemill --set ai.initContainer.image.digest=invalid
          expect_failure helm template invalid charts/typemill --set tests.image.digest=invalid
          expect_failure helm template invalid charts/typemill --set readinessProbe.path=tm/login
          expect_failure helm template invalid charts/typemill --set-string 'typemill.phpIniConfig.bad\.conf=value'
          expect_failure helm template invalid charts/typemill --set ingress.enabled=true --set-json 'ingress.hosts=[]'

      - name: Set up kind cluster
        if: steps.list-changed.outputs.changed == 'true'
        uses: helm/kind-action@v1.14.0

      - name: Run chart-testing (install)
        if: steps.list-changed.outputs.changed == 'true'
        run: ct install --target-branch ${{ github.event.repository.default_branch }}

      - name: Validate rendered resources against Kubernetes API
        if: steps.list-changed.outputs.changed == 'true'
        run: kubectl apply --dry-run=server -f /tmp/typemill-rendered.yaml
