apiVersion: v2
name: typemill
description: >-
  Helm chart for Typemill - a lightweight open-source flat-file CMS
  for creating websites and eBooks from Markdown.
type: application
version: 2.3.0
appVersion: "v2.27.0"
kubeVersion: ">=1.19.0-0"
keywords:
  - typemill
  - cms
  - flat-file
  - markdown
  - documentation
  - ebook
  - wiki
home: https://typemill.net
sources:
  - https://github.com/typemill/typemill
  - https://hub.docker.com/r/kixote/typemill
maintainers:
  - name: codeopsms
    email: maintainer@example.com
    url: https://github.com/codeopsms
icon: https://typemill.net/media/live/typemill-hero-1.png
annotations:
  artifacthub.io/license: MIT
  artifacthub.io/category: integration-delivery
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/changes: |
    - kind: changed
      description: Update Typemill to v2.27.0
    - kind: security
      description: Fix restricted-media path variants, public article API authorization, multilingual write permissions, and SVG sanitization
    - kind: added
      description: Support the openai-responses AI adapter with provider defaults and existing Secret integration
    - kind: added
      description: Allow an empty AI temperature for provider defaults, decimal temperatures from zero to one, and output token options up to 128000
    - kind: changed
      description: Preserve the explicit proxy-detection default and independently pinned v2.26 Cyanine security migration
    - kind: changed
      description: Refresh the BusyBox 1.38.0 test image digest after the upstream tag was republished
  artifacthub.io/images: |
    - name: typemill
      image: kixote/typemill:v2.27.0
    - name: typemill-cyanine-v226-migration
      image: kixote/typemill:v2.26.0
    - name: yq
      image: mikefarah/yq:4.53.3
    - name: busybox
      image: busybox:1.38.0
  artifacthub.io/links: |
    - name: Typemill Documentation
      url: https://docs.typemill.net/
    - name: Typemill Source
      url: https://github.com/typemill/typemill
    - name: Docker Image
      url: https://hub.docker.com/r/kixote/typemill
    - name: support
      url: https://github.com/codeopsms/typemill-helm-chart/issues
  artifacthub.io/screenshots: |
    - title: Typemill Editor
      url: https://typemill.net/media/original/typemill-editor-072025.webp
