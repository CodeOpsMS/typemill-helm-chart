apiVersion: v2
name: typemill
description: >-
  Helm chart for Typemill - a lightweight open-source flat-file CMS
  for creating websites and eBooks from Markdown.
type: application
version: 2.1.0
appVersion: "v2.25.0"
kubeVersion: ">=1.19.0-0"
keywords:
  - typemill
  - cms
  - flat-file
  - markdown
  - documentation
  - ebook
  - wiki
home: https://typemill.net
sources:
  - https://github.com/typemill/typemill
  - https://hub.docker.com/r/kixote/typemill
maintainers:
  - name: codeopsms
    email: maintainer@example.com
    url: https://github.com/codeopsms
icon: https://typemill.net/media/live/typemill-hero-1.png
annotations:
  artifacthub.io/license: MIT
  artifacthub.io/category: integration-delivery
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/changes: |
    - kind: security
      description: Update Typemill to v2.25.0 with the 2FA brute-force protection bypass fix
    - kind: added
      description: Add configurable AI request timeout and reasoning-effort bootstrap values
    - kind: changed
      description: Pin the Typemill, AI bootstrap, and Helm test images to verified OCI index digests
    - kind: changed
      description: Correct the BusyBox 1.38.0 tag and digest mismatch in the Helm connectivity test
    - kind: fixed
      description: Keep successful Helm test pods available long enough for helm test --logs
  artifacthub.io/images: |
    - name: typemill
      image: kixote/typemill:v2.25.0
    - name: yq
      image: mikefarah/yq:4.53.3
    - name: busybox
      image: busybox:1.38.0
  artifacthub.io/links: |
    - name: Typemill Documentation
      url: https://docs.typemill.net/
    - name: Typemill Source
      url: https://github.com/typemill/typemill
    - name: Docker Image
      url: https://hub.docker.com/r/kixote/typemill
    - name: support
      url: https://github.com/codeopsms/typemill-helm-chart/issues
  artifacthub.io/screenshots: |
    - title: Typemill Editor
      url: https://typemill.net/media/original/typemill-editor-072025.webp
