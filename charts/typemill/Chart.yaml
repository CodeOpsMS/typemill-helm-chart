apiVersion: v2
name: typemill
description: >-
  Helm chart for Typemill - a lightweight open-source flat-file CMS
  for creating websites and eBooks from Markdown.
type: application
version: 2.1.1
appVersion: "v2.26.2"
kubeVersion: ">=1.19.0-0"
keywords:
  - typemill
  - cms
  - flat-file
  - markdown
  - documentation
  - ebook
  - wiki
home: https://typemill.net
sources:
  - https://github.com/typemill/typemill
  - https://hub.docker.com/r/kixote/typemill
maintainers:
  - name: codeopsms
    email: maintainer@example.com
    url: https://github.com/codeopsms
icon: https://typemill.net/media/live/typemill-hero-1.png
annotations:
  artifacthub.io/license: MIT
  artifacthub.io/category: integration-delivery
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/changes: |
