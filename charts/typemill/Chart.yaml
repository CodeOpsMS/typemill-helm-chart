apiVersion: v2
name: typemill
description: >-
  Helm chart for Typemill - a lightweight open-source flat-file CMS
  for creating websites and eBooks from Markdown.
type: application
version: 2.2.0
appVersion: "v2.26.2"
kubeVersion: ">=1.19.0-0"
keywords:
  - typemill
  - cms
  - flat-file
  - markdown
  - documentation
  - ebook
  - wiki
home: https://typemill.net
sources:
  - https://github.com/typemill/typemill
  - https://hub.docker.com/r/kixote/typemill
maintainers:
  - name: codeopsms
    email: maintainer@example.com
    url: https://github.com/codeopsms
icon: https://typemill.net/media/live/typemill-hero-1.png
annotations:
  artifacthub.io/license: MIT
  artifacthub.io/category: integration-delivery
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/changes: |
    - kind: security
      description: Fix unauthorized media downloads and XSS vulnerabilities in inline links and hero image alt text
    - kind: added
      description: Safely migrate unchanged persisted Cyanine v2.24.2/v2.25 files to their v2.26 security-fixed versions
    - kind: changed
      description: Update Typemill to v2.26.2, including news and blog date sorting, reverse-proxy subpath handling, SMTP username validation, PHP 8.5 compatibility fixes, setup directory creation, and the corrected PHP 8.2 setup requirement
    - kind: added
      description: Expose the upstream Docker proxy-detection switch as a chart value
    - kind: changed
      description: Move the upstream container runtime to PHP 8.5 and drop PHP 8.1 support
    - kind: changed
      description: Refresh the BusyBox 1.38.0 index digest after its upstream tag was republished
    - kind: fixed
      description: Fix user profile image handling and filenames without Typemill prefixes
  artifacthub.io/images: |
    - name: typemill
      image: kixote/typemill:v2.26.2
    - name: typemill-cyanine-v226-migration
      image: kixote/typemill:v2.26.0
    - name: yq
      image: mikefarah/yq:4.53.3
    - name: busybox
      image: busybox:1.38.0
  artifacthub.io/links: |
    - name: Typemill Documentation
      url: https://docs.typemill.net/
    - name: Typemill Source
      url: https://github.com/typemill/typemill
    - name: Docker Image
      url: https://hub.docker.com/r/kixote/typemill
    - name: support
      url: https://github.com/codeopsms/typemill-helm-chart/issues
  artifacthub.io/screenshots: |
    - title: Typemill Editor
      url: https://typemill.net/media/original/typemill-editor-072025.webp
