suite: hpa tests
templates:
  - templates/hpa.yaml
release:
  name: test-release
  namespace: test-ns
tests:
  - it: should not render HPA when disabled
    set:
      autoscaling.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should reject HPA when enabled
    set:
      autoscaling.enabled: true
      autoscaling.minReplicas: 2
      autoscaling.maxReplicas: 10
      autoscaling.targetCPUUtilizationPercentage: 80
    asserts:
      - failedTemplate:
          errorMessage: "autoscaling.enabled is unsupported because Typemill uses mutable flat-file state and must run as a single replica"
