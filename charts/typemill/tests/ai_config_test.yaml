suite: ai configuration tests
templates:
  - templates/deployment.yaml
release:
  name: test-release
  namespace: test-ns
tests:
  - it: should not render ai init container by default
    asserts:
      - notExists:
          path: spec.template.spec.initContainers

  - it: should render openai-compatible ai init container with existing secret
    set:
      ai.enabled: true
      ai.adapter: openai
      ai.baseUrl: https://api.openai.com/v1
      ai.model: gpt-4.1
      ai.providerName: OpenAI
      ai.providerTerms: https://openai.com/policies/terms-of-use
      ai.existingSecret: typemill-ai-secret
      ai.temperature: "0.6"
      ai.outputTokens: 6000
      ai.timeoutSeconds: 180
      ai.reasoningEffort: low
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: ai-config
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: mikefarah/yq@sha256:11a1f0b604b13dbbdc662260d8db6f644b22d8553122a25c1b5b2e8713ca6977
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.runAsUser
          value: 0
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.runAsGroup
          value: 0
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: TYPEMILL_AI_ADAPTER
            value: openai
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: TYPEMILL_AI_BASE_URL
            value: https://api.openai.com/v1
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: TYPEMILL_AI_MODEL
            value: gpt-4.1
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: TYPEMILL_AI_PROVIDER_NAME
            value: OpenAI
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: TYPEMILL_AI_PROVIDER_TERMS
            value: https://openai.com/policies/terms-of-use
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: TYPEMILL_AI_TEMPERATURE
            value: "0.6"
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: TYPEMILL_AI_OUTPUT_TOKENS
            value: "6000"
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: TYPEMILL_AI_TIMEOUT_SECONDS
            value: "180"
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: TYPEMILL_AI_REASONING_EFFORT
            value: low
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: TYPEMILL_AI_API_KEY
            valueFrom:
              secretKeyRef:
                name: typemill-ai-secret
                key: aiApiKey
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: '\.aitimeout = strenv\(TYPEMILL_AI_TIMEOUT_SECONDS\)'
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: '\.ai_reasoning_effort = strenv\(TYPEMILL_AI_REASONING_EFFORT\)'
      - contains:
          path: spec.template.spec.initContainers[0].volumeMounts
          content:
            name: typemill-data
            mountPath: /work/settings
            subPath: settings

  - it: should render local openai-compatible provider without secret
    set:
      ai.enabled: true
      ai.adapter: openai
      ai.baseUrl: http://ollama.default.svc.cluster.local:11434/v1
      ai.model: llama3
      ai.providerName: Ollama
      ai.providerTerms: ""
    asserts:
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: TYPEMILL_AI_BASE_URL
            value: http://ollama.default.svc.cluster.local:11434/v1
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: TYPEMILL_AI_MODEL
            value: llama3
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: TYPEMILL_AI_PROVIDER_TERMS
            value: ""
      - notContains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: TYPEMILL_AI_API_KEY

  - it: should render provider defaults when optional ai fields are empty
    set:
      ai.enabled: true
      ai.adapter: openai
    asserts:
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: TYPEMILL_AI_BASE_URL
            value: https://api.openai.com/v1
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: TYPEMILL_AI_MODEL
            value: gpt-4.1
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: TYPEMILL_AI_PROVIDER_NAME
            value: OpenAI
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: TYPEMILL_AI_TIMEOUT_SECONDS
            value: "120"
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: TYPEMILL_AI_REASONING_EFFORT
            value: ""

  - it: should default new ai settings when legacy reused values omit them
    set:
      ai.enabled: true
      ai.adapter: openai
      ai.timeoutSeconds: null
      ai.reasoningEffort: null
    asserts:
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: TYPEMILL_AI_TIMEOUT_SECONDS
            value: "120"
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: TYPEMILL_AI_REASONING_EFFORT
            value: ""

  - it: should not expose provider api keys to the typemill application container
    set:
      ai.enabled: true
      ai.adapter: openai
      ai.existingSecret: typemill-ai-secret
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers[0].env
          count: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TZ
            value: UTC
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: TYPEMILL_AI_API_KEY

  - it: should render custom api secret key
    set:
      ai.enabled: true
      ai.adapter: openai
      ai.existingSecret: typemill-ai-secret
      ai.secretKeys.apiKey: openai-api-key
    asserts:
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: TYPEMILL_AI_API_KEY
            valueFrom:
              secretKeyRef:
                name: typemill-ai-secret
                key: openai-api-key

  - it: should render custom yq image and pull policy
    set:
      ai.enabled: true
      ai.adapter: openai
      ai.existingSecret: typemill-ai-secret
      ai.initContainer.image.repository: ghcr.io/example/yq
      ai.initContainer.image.tag: 4.49.2
      ai.initContainer.image.digest: ""
      ai.initContainer.image.pullPolicy: Always
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: ghcr.io/example/yq:4.49.2
      - equal:
          path: spec.template.spec.initContainers[0].imagePullPolicy
          value: Always

  - it: should render ai init container resources
    set:
      ai.enabled: true
      ai.adapter: openai
      ai.existingSecret: typemill-ai-secret
      ai.initContainer.resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].resources.requests.cpu
          value: 10m
      - equal:
          path: spec.template.spec.initContainers[0].resources.requests.memory
          value: 32Mi
      - equal:
          path: spec.template.spec.initContainers[0].resources.limits.memory
          value: 64Mi

  - it: should render ai init container security context
    set:
      ai.enabled: true
      ai.adapter: openai
      ai.existingSecret: typemill-ai-secret
      ai.initContainer.securityContext:
        runAsUser: 33
        runAsGroup: 33
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.runAsUser
          value: 33
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.runAsGroup
          value: 33

  - it: should render anthropic ai init container with custom secret key
    set:
      ai.enabled: true
      ai.adapter: anthropic
      ai.baseUrl: https://api.anthropic.com/v1
      ai.model: claude-sonnet-4-5
      ai.providerName: Anthropic
      ai.providerTerms: https://www.anthropic.com/legal/consumer-terms
      ai.existingSecret: typemill-ai-secret
      ai.secretKeys.apiKey: anthropic-api-key
    asserts:
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: TYPEMILL_AI_ADAPTER
            value: anthropic
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: TYPEMILL_AI_MODEL
            value: claude-sonnet-4-5
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: TYPEMILL_AI_PROVIDER_NAME
            value: Anthropic
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: TYPEMILL_AI_API_KEY
            valueFrom:
              secretKeyRef:
                name: typemill-ai-secret
                key: anthropic-api-key

  - it: should not inject api key when adapter is none
    set:
      ai.enabled: true
      ai.adapter: none
      ai.existingSecret: typemill-ai-secret
    asserts:
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: TYPEMILL_AI_ADAPTER
            value: none
      - notContains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: TYPEMILL_AI_API_KEY

  - it: should map legacy claude ai values to anthropic adapter
    set:
      ai.enabled: true
      ai.service: claude
      ai.existingSecret: typemill-ai-secret
      ai.secretKeys.claudeKey: legacy-anthropic-key
      ai.claudeModel: claude-legacy-model
    asserts:
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: TYPEMILL_AI_ADAPTER
            value: anthropic
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: TYPEMILL_AI_BASE_URL
            value: https://api.anthropic.com/v1
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: TYPEMILL_AI_MODEL
            value: claude-legacy-model
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: TYPEMILL_AI_API_KEY
            valueFrom:
              secretKeyRef:
                name: typemill-ai-secret
                key: legacy-anthropic-key

  - it: should prefer explicit new adapter over conflicting legacy service
    set:
      ai.enabled: true
      ai.adapter: anthropic
      ai.service: chatgpt
      ai.existingSecret: typemill-ai-secret
      ai.secretKeys.chatgptKey: legacy-openai-key
    asserts:
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: TYPEMILL_AI_ADAPTER
            value: anthropic
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: TYPEMILL_AI_MODEL
            value: claude-sonnet-4-5
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: TYPEMILL_AI_API_KEY
            valueFrom:
              secretKeyRef:
                name: typemill-ai-secret
                key: aiApiKey

  - it: should fail when ai is enabled without persistence
    set:
      ai.enabled: true
      persistence.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: "ai.enabled requires persistence.enabled because Typemill stores AI settings under /var/www/html/settings"

  - it: should render ai init container digest when set
    set:
      ai.enabled: true
      ai.adapter: openai
      ai.existingSecret: typemill-ai-secret
      ai.initContainer.image.digest: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: mikefarah/yq@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
