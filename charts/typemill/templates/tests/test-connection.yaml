{{- $tests := .Values.tests | default dict -}}
{{- $testImage := $tests.image | default dict -}}
{{- if ($tests.enabled | default false) }}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "typemill.fullname" . }}-test-connection"
  labels:
    {{- include "typemill.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    # Keep the completed pod so `helm test --logs` can retrieve its output.
    # A subsequent test run removes the previous pod before creating a new one.
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  automountServiceAccountToken: false
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: wget
      image: {{ include "typemill.testImage" . | quote }}
      imagePullPolicy: {{ $testImage.pullPolicy | default "IfNotPresent" }}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      command:
        - wget
      args:
        - --spider
        - --timeout=10
        - http://{{ include "typemill.fullname" . }}:{{ .Values.service.port }}{{ .Values.readinessProbe.path }}
      {{- with $tests.resources }}
      resources:
        {{- toYaml . | nindent 8 }}
      {{- else }}
      resources:
        limits:
          cpu: 100m
          memory: 32Mi
        requests:
          cpu: 10m
          memory: 16Mi
      {{- end }}
  restartPolicy: Never
{{- end }}
