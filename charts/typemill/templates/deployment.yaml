{{- $legacyService := .Values.ai.service | default "" -}}
{{- $aiAdapter := .Values.ai.adapter | default "" -}}
{{- $legacyValuesActive := false -}}
{{- if and (eq $legacyService "chatgpt") (or (not $aiAdapter) (eq $aiAdapter "openai")) -}}
{{- $aiAdapter = "openai" -}}
{{- $legacyValuesActive = true -}}
{{- else if and (eq $legacyService "claude") (or (not $aiAdapter) (eq $aiAdapter "openai")) -}}
{{- $aiAdapter = "anthropic" -}}
{{- $legacyValuesActive = true -}}
{{- else if not $aiAdapter -}}
{{- $aiAdapter = "openai" -}}
{{- end -}}
{{- $aiBaseUrl := .Values.ai.baseUrl | default "" -}}
{{- if not $aiBaseUrl -}}
{{- if eq $aiAdapter "anthropic" -}}
{{- $aiBaseUrl = "https://api.anthropic.com/v1" -}}
{{- else if eq $aiAdapter "openai" -}}
{{- $aiBaseUrl = "https://api.openai.com/v1" -}}
{{- end -}}
{{- end -}}
{{- $aiModel := .Values.ai.model | default "" -}}
{{- if not $aiModel -}}
{{- if and $legacyValuesActive (eq $legacyService "chatgpt") -}}
{{- $aiModel = .Values.ai.chatgptModel -}}
{{- else if and $legacyValuesActive (eq $legacyService "claude") -}}
{{- $aiModel = .Values.ai.claudeModel -}}
{{- else if eq $aiAdapter "anthropic" -}}
{{- $aiModel = "claude-sonnet-4-5" -}}
{{- else if eq $aiAdapter "openai" -}}
{{- $aiModel = "gpt-4.1" -}}
{{- end -}}
{{- end -}}
{{- $aiProviderName := .Values.ai.providerName | default "" -}}
{{- if not $aiProviderName -}}
{{- if eq $aiAdapter "anthropic" -}}
{{- $aiProviderName = "Anthropic" -}}
{{- else if eq $aiAdapter "openai" -}}
{{- $aiProviderName = "OpenAI" -}}
{{- end -}}
{{- end -}}
{{- $aiProviderTerms := .Values.ai.providerTerms | default "" -}}
{{- $aiSecretKey := .Values.ai.secretKeys.apiKey -}}
{{- if and $legacyValuesActive (eq $legacyService "chatgpt") -}}
{{- $aiSecretKey = .Values.ai.secretKeys.chatgptKey -}}
{{- else if and $legacyValuesActive (eq $legacyService "claude") -}}
{{- $aiSecretKey = .Values.ai.secretKeys.claudeKey -}}
{{- end -}}
{{- if and .Values.ai.enabled (not .Values.persistence.enabled) }}
{{- fail "ai.enabled requires persistence.enabled because Typemill stores AI settings under /var/www/html/settings" }}
{{- end }}
{{- if and .Values.ai.enabled (not (or (eq $aiAdapter "openai") (eq $aiAdapter "anthropic") (eq $aiAdapter "none"))) }}
{{- fail "ai.adapter must be one of 'openai', 'anthropic', or 'none'" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "typemill.fullname" . }}
  labels:
    {{- include "typemill.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "typemill.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- if .Values.typemill.phpIniConfig }}
        checksum/php-ini: {{ .Values.typemill.phpIniConfig | toYaml | sha256sum }}
        {{- end }}
        {{- if .Values.typemill.htaccess }}
        checksum/htaccess: {{ .Values.typemill.htaccess | sha256sum }}
        {{- end }}
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "typemill.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "typemill.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- if .Values.ai.enabled }}
      initContainers:
        - name: ai-config
          image: {{ include "typemill.aiInitImage" . | quote }}
          imagePullPolicy: {{ .Values.ai.initContainer.image.pullPolicy }}
          command:
            - sh
            - -ec
            - |
              mkdir -p /work/settings
              touch /work/settings/settings.yaml /work/settings/secrets.yaml
              yq eval -i '.ai_adapter = strenv(TYPEMILL_AI_ADAPTER) |
                .ai_base_url = strenv(TYPEMILL_AI_BASE_URL) |
                .ai_model = strenv(TYPEMILL_AI_MODEL) |
                .ai_provider_name = strenv(TYPEMILL_AI_PROVIDER_NAME) |
                .ai_provider_terms = strenv(TYPEMILL_AI_PROVIDER_TERMS) |
                .aitemperature = strenv(TYPEMILL_AI_TEMPERATURE) |
                .aioutputtoken = strenv(TYPEMILL_AI_OUTPUT_TOKENS)' /work/settings/settings.yaml
              if [ -n "${TYPEMILL_AI_API_KEY:-}" ]; then
                yq eval -i '.ai_api_key = strenv(TYPEMILL_AI_API_KEY)' /work/settings/secrets.yaml
                yq eval -i 'del(.chatgptKey, .claudeKey)' /work/settings/secrets.yaml
              else
                yq eval -i 'del(.ai_api_key, .chatgptKey, .claudeKey)' /work/settings/secrets.yaml
              fi
          env:
            - name: TYPEMILL_AI_ADAPTER
              value: {{ $aiAdapter | quote }}
            - name: TYPEMILL_AI_BASE_URL
              value: {{ $aiBaseUrl | quote }}
            - name: TYPEMILL_AI_MODEL
              value: {{ $aiModel | quote }}
            - name: TYPEMILL_AI_PROVIDER_NAME
              value: {{ $aiProviderName | quote }}
            - name: TYPEMILL_AI_PROVIDER_TERMS
              value: {{ $aiProviderTerms | quote }}
            - name: TYPEMILL_AI_TEMPERATURE
              value: {{ .Values.ai.temperature | quote }}
            - name: TYPEMILL_AI_OUTPUT_TOKENS
              value: {{ .Values.ai.outputTokens | quote }}
            {{- if and .Values.ai.existingSecret (ne $aiAdapter "none") }}
            - name: TYPEMILL_AI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.ai.existingSecret | quote }}
                  key: {{ $aiSecretKey | quote }}
            {{- end }}
          {{- with .Values.ai.initContainer.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.ai.initContainer.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: typemill-data
              mountPath: /work/settings
              subPath: settings
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ include "typemill.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            - name: TZ
              value: {{ .Values.typemill.timezone | quote }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.startupProbe.path }}
              port: http
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.startupProbe.timeoutSeconds }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: typemill-data
              mountPath: /var/www/html/settings
              subPath: settings
            - name: typemill-data
              mountPath: /var/www/html/media
              subPath: media
            - name: typemill-data
              mountPath: /var/www/html/data
              subPath: data
            - name: typemill-data
              mountPath: /var/www/html/cache
              subPath: cache
            - name: typemill-data
              mountPath: /var/www/html/plugins
              subPath: plugins
            - name: typemill-data
              mountPath: /var/www/html/content
              subPath: content
            - name: typemill-data
              mountPath: /var/www/html/themes
              subPath: themes
            {{- end }}
            {{- if .Values.typemill.htaccess }}
            - name: htaccess
              mountPath: /var/www/html/.htaccess
              subPath: .htaccess
              readOnly: true
            {{- end }}
            {{- if .Values.typemill.phpIniConfig }}
            {{- range $key, $value := .Values.typemill.phpIniConfig }}
            - name: php-ini-config
              mountPath: /usr/local/etc/php/conf.d/{{ $key }}
              subPath: {{ $key }}
              readOnly: true
            {{- end }}
            {{- end }}
      volumes:
        {{- if .Values.persistence.enabled }}
        - name: typemill-data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (include "typemill.fullname" .) }}
        {{- end }}
        {{- if .Values.typemill.htaccess }}
        - name: htaccess
          configMap:
            name: {{ include "typemill.fullname" . }}-htaccess
        {{- end }}
        {{- if .Values.typemill.phpIniConfig }}
        - name: php-ini-config
          configMap:
            name: {{ include "typemill.fullname" . }}-php-ini
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
