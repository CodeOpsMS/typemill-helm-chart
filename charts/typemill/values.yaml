# -- Number of Typemill replicas. Use 1 with ReadWriteOnce persistence.
replicaCount: 1

image:
  # -- Container image repository
  repository: kixote/typemill
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Overrides the image tag (default: Chart appVersion)
  tag: ""
  # -- Image digest for immutable pinning. If set, this overrides the tag.
  # To use image.tag, explicitly set this to an empty string.
  digest: "sha256:4e9dff1795190fb3f09fc9e967643a030a0b8ee51e5e57aff086c270976ada07"

# -- Image pull secrets for private registries
imagePullSecrets: []
# -- Override the chart name
nameOverride: ""
# -- Override the full release name
fullnameOverride: ""

serviceAccount:
  # -- Create a ServiceAccount
  create: true
  # -- Annotations for the ServiceAccount
  annotations: {}
  # -- Name of the ServiceAccount (auto-generated if empty)
  name: ""
  # -- Disable auto-mounting of service account token (security best practice)
  automountServiceAccountToken: false

# -- Annotations to add to the pod
podAnnotations: {}
# -- Labels to add to the pod
podLabels: {}

# -- Pod security context
podSecurityContext: {}
  # fsGroup: 33

# -- Container security context
securityContext: {}
  # runAsUser: 33
  # runAsGroup: 33

service:
  # -- Service type
  type: ClusterIP
  # -- Service port
  port: 80

ingress:
  # -- Enable ingress
  enabled: false
  # -- Ingress class name
  className: ""
  # -- Ingress annotations
  annotations: {}
  # -- Ingress hosts configuration
  hosts:
    - host: typemill.example.com
      paths:
        - path: /
          pathType: ImplementationSpecific
  # -- Ingress TLS configuration
  tls: []
  #  - secretName: typemill-tls
  #    hosts:
  #      - typemill.example.com

ai:
  # -- Enable Typemill AI configuration bootstrap.
  # This writes/updates AI provider settings in the persisted Typemill settings files
  # on every pod start before the application container starts.
  enabled: false
  # -- AI adapter to configure. Supported by Typemill: openai, anthropic, none.
  # Use openai for OpenAI-compatible APIs such as OpenAI, Ollama, LM Studio, LocalAI, vLLM, and OpenRouter.
  adapter: openai
  # -- AI provider base URL. Do not add a trailing slash. Defaults to the adapter's cloud endpoint when empty.
  baseUrl: ""
  # -- AI model name as expected by the configured provider. Defaults to a provider-specific model when empty.
  model: ""
  # -- Optional human-readable provider name shown to Typemill users.
  providerName: ""
  # -- Optional provider terms URL shown to Typemill users.
  providerTerms: ""
  # -- Existing Kubernetes Secret containing the provider API key. Optional for local providers without authentication.
  existingSecret: ""
  secretKeys:
    # -- Secret key name for the provider API key.
    apiKey: aiApiKey
    # -- Deprecated: legacy secret key name for the OpenAI/ChatGPT API key.
    chatgptKey: chatgptKey
    # -- Deprecated: legacy secret key name for the Anthropic/Claude API key.
    claudeKey: claudeKey
  # -- Deprecated: legacy AI service value. Use ai.adapter instead.
  service: ""
  # -- Deprecated: legacy ChatGPT/OpenAI model value. Use ai.model instead.
  chatgptModel: gpt-4.1
  # -- Deprecated: legacy Claude model value. Use ai.model instead.
  claudeModel: claude-sonnet-4-5
  # -- Typemill AI temperature setting as string to match Typemill form values.
  temperature: "0.7"
  # -- Typemill AI maximum output token setting.
  outputTokens: 4000
  # -- Typemill AI request timeout in seconds.
  timeoutSeconds: 120
  # -- Reasoning effort for compatible OpenAI-style models. Empty uses the provider default.
  reasoningEffort: ""
  initContainer:
    image:
      # -- yq image used to merge AI settings into Typemill persisted YAML files.
      repository: mikefarah/yq
      tag: "4.53.3"
      # -- yq image digest for immutable pinning. If set, this overrides the tag.
      # To use a custom tag, explicitly set this to an empty string.
      digest: "sha256:11a1f0b604b13dbbdc662260d8db6f644b22d8553122a25c1b5b2e8713ca6977"
      pullPolicy: IfNotPresent
    # -- Security context for the AI bootstrap init container.
    # The yq image runs as a non-root user by default, but freshly provisioned
    # PVC subPath directories are commonly root-owned.
    securityContext:
      runAsUser: 0
      runAsGroup: 0
    resources: {}

resources: {}
  # limits:
  #   cpu: 500m
  #   memory: 256Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  # -- Deprecated and unsupported for Typemill's shared flat-file state. Must remain false.
  enabled: false
  # -- Minimum number of replicas
  minReplicas: 1
  # -- Maximum number of replicas
  maxReplicas: 10
  # -- Target CPU utilization percentage
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# -- Node selector constraints
nodeSelector: {}
# -- Tolerations for pod scheduling
tolerations: []
# -- Affinity rules for pod scheduling
affinity: {}

# -- Deployment strategy. Use Recreate with ReadWriteOnce PVC.
strategy:
  type: Recreate

# -- Termination grace period in seconds
terminationGracePeriodSeconds: 60

securityMigrations:
  cyanineV226:
    # -- Update unchanged persisted Cyanine v2.24.2/v2.25 stock files to the v2.26 security-fixed versions.
    enabled: true
    # -- Fail pod startup whenever affected Cyanine files do not match verified stock hashes.
    failOnModified: false
    # -- Immutable v2.26.0 application image used only as the source of the verified fixed files.
    # Keep this independent from image.* so later Typemill upgrades cannot change the migration input.
    image:
      repository: kixote/typemill
      tag: v2.26.2
      digest: "sha256:628f79a08cc75bc07777ae4b95312fb9770a531645789e698f12f96de6624156"
      pullPolicy: IfNotPresent
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 33
      runAsGroup: 33
      capabilities:
        drop:
          - ALL
    resources: {}

persistence:
  # -- Enable persistence for Typemill data
  enabled: true
  # -- Storage class (empty string uses cluster default)
  storageClass: ""
  # -- PVC access mode
  accessMode: ReadWriteOnce
  # -- PVC storage size
  size: 5Gi
  # -- Use an existing PVC instead of creating a new one
  existingClaim: ""
  # -- Retain chart-managed PVCs when the Helm release is uninstalled
  retain: true
  # -- Additional annotations for chart-managed PVCs
  annotations: {}

livenessProbe:
  # -- Enable liveness probe
  enabled: true
  # -- Path for HTTP liveness check
  path: /tm/login
  # -- Initial delay before first check (seconds)
  initialDelaySeconds: 15
  # -- Check interval (seconds)
  periodSeconds: 10
  # -- Timeout per check (seconds)
  timeoutSeconds: 5
  # -- Failure threshold before restart
  failureThreshold: 3

readinessProbe:
  # -- Enable readiness probe
  enabled: true
  # -- Path for HTTP readiness check
  path: /tm/login
  # -- Initial delay before first check (seconds)
  initialDelaySeconds: 10
  # -- Check interval (seconds)
  periodSeconds: 5
  # -- Timeout per check (seconds)
  timeoutSeconds: 3
  # -- Failure threshold before marking unready
  failureThreshold: 3

startupProbe:
  # -- Enable startup probe
  enabled: true
  # -- Path for HTTP startup check
  path: /tm/login
  # -- Failure threshold (startup gets periodSeconds * failureThreshold to start)
  failureThreshold: 30
  # -- Check interval during startup (seconds)
  periodSeconds: 5
  # -- Timeout per check (seconds)
  timeoutSeconds: 3

typemill:
  # -- Timezone for the container (TZ database format)
  timezone: "UTC"

  # -- Force Typemill's reverse-proxy detection through the upstream Docker environment variable.
  # The chart explicitly disables the v2.26.1 image default to avoid trusting forwarded
  # headers unexpectedly. A persisted `proxy: true` setting remains active.
  proxyDetection: false

  # -- PHP INI configuration overrides. Each key becomes a file in /usr/local/etc/php/conf.d/
  phpIniConfig:
    typemill-recommended.ini: |
      upload_max_filesize = 100M
      post_max_size = 100M
      max_execution_time = 60
      output_buffering = On

  # -- Custom .htaccess content. Leave empty to use the default shipped with the image.
  htaccess: ""

  # Plugin and theme installation is done via the Typemill admin UI
  # at /tm/plugins and /tm/themes. Ensure the plugins/ and themes/
  # directories are persisted via the PVC.

tests:
  # -- Enable the Helm connectivity test pod
  enabled: true
  image:
    # -- Container image repository for the Helm connectivity test
    repository: busybox
    # -- Container image tag for the Helm connectivity test
    tag: "1.38.0"
    # -- Immutable multi-platform digest for the Helm connectivity test image
    digest: "sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616"
    # -- Image pull policy for the Helm connectivity test
    pullPolicy: IfNotPresent
  # -- Resource requests and limits for the Helm connectivity test
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 32Mi
